name: LWAVEE Instagram Content Publishing Scheduler

on:
  schedule:
    # Run every 15 minutes (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force immediate publishing run of due approved posts'
        required: false
        default: 'false'

jobs:
  publish-due-posts:
    name: Claim & Publish Due Approved Instagram Posts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger LWAVEE Backend Publishing Engine
        run: |
          echo "Triggering cloud scheduler at $(date -u +'%Y-%m-%dT%H:%M:%SZ')..."
          
          if [ -z "${{ secrets.BACKEND_API_URL }}" ] || [ -z "${{ secrets.SCHEDULER_SECRET }}" ]; then
            echo "::notice title=Scheduler Secrets Required::BACKEND_API_URL and/or SCHEDULER_SECRET are not configured in GitHub Secrets yet."
            echo "To enable automated Instagram publishing without local computer dependency:"
            echo "1. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions"
            echo "2. Add secret: BACKEND_API_URL (e.g. https://instagram-automation-lwavee.onrender.com)"
            echo "3. Add secret: SCHEDULER_SECRET (e.g. development_scheduler_secret_key_change_in_production)"
            echo "Skipping this cycle cleanly until secrets are configured."
            exit 0
          fi

          ENDPOINT="${{ secrets.BACKEND_API_URL }}/api/internal/scheduler/run"
          
          # Call backend secured endpoint with retry
          RESPONSE=$(curl -s -S -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}" \
            -H "User-Agent: GitHub-Actions-LWAVEE-Scheduler/1.0" \
            -d '{"trigger": "github-actions-cron", "timestamp": "'$(date -u +'%Y-%m-%dT%H:%M:%SZ')'"}' \
            --retry 2 \
            --retry-delay 5 \
            --max-time 180)

          echo "Response from backend: $RESPONSE"

          # Verify response contains success
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Scheduler cycle completed successfully."
          else
            echo "::warning::Backend reported non-success or empty response."
          fi

